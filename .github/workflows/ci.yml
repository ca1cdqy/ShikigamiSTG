name: Continuous Integration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Install Linux X11/Wayland dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxfixes-dev libxcursor-dev \
            libxi-dev libxrandr-dev libxrender-dev libxss-dev \
            libxkbcommon-dev libwayland-dev xorgproto
      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/.xmake/packages
          key: ${{ runner.os }}-${{ runner.arch }}-xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xmake-

      - name: Configure shared release build
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if xmake f -m release --shiki_shared=y --asset_tests=n -y; then
              exit 0
            fi
            echo "xmake configure attempt $attempt failed, retrying..."
            sleep 5
          done
          exit 1

      - name: Build framework
        run: xmake build shiki

      - name: Build resource-independent tests
        run: xmake build tests

      - name: Run resource-independent tests
        run: xmake run tests

      - name: Build example
        run: xmake build th06

  wasm:
    name: Build (wasm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure wasm release build
        run: xmake f -p wasm -m release -y

      # The wave/particle demo needs no extracted assets and links the full
      # engine runtime, so it compiles the WebGL2 renderer backend and the
      # wasm frontend on every push. The TH06 example additionally requires
      # an asset package built by tools/package_wasm_data.py, which needs
      # the original game files and is therefore built locally only.
      - name: Build WebGL2 demo
        run: xmake build wave_particle

  documentation:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Assemble documentation
        run: |
          mkdir -p build/docs
          cp -r docs/. build/docs/
          doxygen Doxyfile
          test -f build/docs/index.html
          test -f build/docs/api/index.html

